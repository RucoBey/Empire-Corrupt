<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRYPTO EMPIRE — Tap to Earn</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Gerekli harici kütüphaneler -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #FFD700; --gold2: #FFA500; --neon: #00FFCC; --neon2: #00BFFF;
      --bg: #080C14; --panel: #0D1420; --panel2: #111C2E; --border: rgba(0,255,204,0.15);
      --text: #E0F0FF; --muted: #4A6080; --danger: #FF4466;
    }
    body {
      background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column;
      align-items: center; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(0,255,204,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,204,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: 0;
    }
    .app { width: 100%; max-width: 420px; min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }
    .header { padding: 12px 16px 8px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(180deg, rgba(0,255,204,0.07) 0%, transparent 100%); border-bottom: 1px solid var(--border); }
    .header-left { display: flex; flex-direction: column; }
    .user-name { font-family: 'Orbitron', monospace; font-size: 13px; color: var(--neon); letter-spacing: 2px; text-transform: uppercase; }
    .user-level { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    .header-center { text-align: center; }
    .game-title { font-family: 'Orbitron', monospace; font-size: 16px; font-weight: 900; background: linear-gradient(135deg, var(--gold), var(--gold2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .league-badge { background: linear-gradient(135deg, #1a2a1a, #0d1a0d); border: 1px solid var(--neon); border-radius: 20px; padding: 3px 10px; font-size: 10px; font-family: 'Orbitron', monospace; color: var(--neon); letter-spacing: 1px; }
    .coin-display { padding: 16px; text-align: center; }
    .coin-amount { font-family: 'Orbitron', monospace; font-size: 38px; font-weight: 900; background: linear-gradient(135deg, #FFD700, #FF8C00, #FFD700); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear infinite; line-height: 1; }
    @keyframes shimmer { to { background-position: 200% center; } }
    .coin-label { font-size: 12px; color: var(--muted); letter-spacing: 3px; margin-top: 2px; }
    .stats-row { display: flex; gap: 8px; padding: 0 16px 12px; }
    .stat-card { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; text-align: center; position: relative; overflow: hidden; }
    .stat-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--neon), transparent); }
    .stat-val { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; color: var(--gold); }
    .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 1px; }
    .level-section { padding: 0 16px 12px; }
    .level-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .level-info span:last-child { color: var(--neon); font-family: 'Orbitron', monospace; }
    .progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon2), var(--neon)); border-radius: 3px; transition: width 0.5s ease; box-shadow: 0 0 8px var(--neon); }
    .tap-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; min-height: 260px; }
    .tap-orb-wrapper { position: relative; width: 220px; height: 220px; }
    .ring { position: absolute; border-radius: 50%; border: 1px solid; animation: ring-pulse 3s ease-in-out infinite; pointer-events: none; }
    .ring-1 { inset: -20px; border-color: rgba(0,255,204,0.12); animation-delay: 0s; }
    .ring-2 { inset: -40px; border-color: rgba(0,255,204,0.07); animation-delay: 0.5s; }
    .ring-3 { inset: -60px; border-color: rgba(0,255,204,0.04); animation-delay: 1s; }
    @keyframes ring-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.6; } }
    .tap-orb { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #1a3a5c, #050d1a 70%); border: 2px solid rgba(0,255,204,0.3); box-shadow: 0 0 30px rgba(0,255,204,0.15), 0 0 60px rgba(0,191,255,0.1), inset 0 0 40px rgba(0,0,0,0.5); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s ease, box-shadow 0.1s ease; position: relative; overflow: hidden; }
    .tap-orb:active { transform: scale(0.93); box-shadow: 0 0 50px rgba(0,255,204,0.4), 0 0 100px rgba(0,191,255,0.2), inset 0 0 40px rgba(0,0,0,0.5); }
    .orb-icon { font-size: 80px; pointer-events: none; filter: drop-shadow(0 0 20px rgba(255,215,0,0.6)); }
    .float-label { position: fixed; font-family: 'Orbitron', monospace; font-size: 24px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.8); pointer-events: none; animation: float-up 1s ease-out forwards; z-index: 999; }
    @keyframes float-up { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(0.8); } }
    .energy-section { padding: 0 16px 10px; }
    .energy-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .energy-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; display: flex; align-items: center; gap: 5px; }
    .energy-label::before { content: '⚡'; font-size: 12px; }
    .energy-count { font-family: 'Orbitron', monospace; font-size: 11px; color: #FFD700; }
    .energy-track { height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,165,0,0.2); }
    .energy-fill { height: 100%; background: linear-gradient(90deg, #FF6600, #FFD700, #FFFF00); border-radius: 4px; transition: width 0.1s linear; box-shadow: 0 0 8px rgba(255,215,0,0.5); }
    .bottom-nav { display: flex; background: var(--panel); border-top: 1px solid var(--border); padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; cursor: pointer; transition: all 0.2s; position: relative; }
    .nav-item.active { opacity: 1; }
    .nav-item.active .nav-icon { filter: drop-shadow(0 0 6px var(--neon)); }
    .nav-item.active .nav-lbl { color: var(--neon); }
    .nav-item:not(.active) { opacity: 0.4; }
    .nav-icon { font-size: 22px; }
    .nav-lbl { font-size: 9px; letter-spacing: 1px; font-family: 'Orbitron', monospace; }
    .screen { display: none; flex: 1; overflow-y: auto; width: 100%; }
    .screen.active { display: flex; flex-direction: column; }
    .screen-title { font-family: 'Orbitron', monospace; font-size: 16px; font-weight: 700; color: var(--neon); padding: 16px 16px 8px; letter-spacing: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .upgrades-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 16px; }
    .upgrade-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer; transition: all 0.2s; text-align: center; }
    .upgrade-card.affordable { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.1); }
    .upgrade-icon { font-size: 28px; margin-bottom: 6px; }
    .upgrade-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .upgrade-level { font-size: 11px; color: var(--neon); font-family: 'Orbitron', monospace; margin-bottom: 6px; }
    .upgrade-cost { font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; color: var(--gold); }
    .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: #0d1a0d; border: 1px solid var(--neon); border-radius: 20px; padding: 8px 20px; font-family: 'Orbitron', monospace; font-size: 12px; color: var(--neon); z-index: 1000; box-shadow: 0 0 15px rgba(0,255,204,0.3); }
    .boost-btn { background: linear-gradient(135deg, #FF4466, #FF0066); border: none; border-radius: 8px; padding: 4px 10px; font-family: 'Orbitron', monospace; font-size: 11px; color: white; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .boost-btn:disabled { background: #222; color: #555; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="user-name" id="userName">PLAYER</div>
      <div class="user-level" id="userLevelLabel">LEVEL 1 · BRONZE</div>
    </div>
    <div class="header-center"><div class="game-title">CRYPTO EMPIRE</div></div>
    <div class="header-right"><div class="league-badge" id="leagueBadge">BRONZE</div></div>
  </div>

  <!-- MAIN TAP SCREEN -->
  <div class="screen active" id="screen-tap">
    <div class="coin-display">
      <div class="coin-amount" id="coinDisplay">0</div>
      <div class="coin-label">COINS</div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-val" id="tapPowerDisplay">+1</div><div class="stat-lbl">TAP POWER</div></div>
      <div class="stat-card"><div class="stat-val" id="passiveDisplay">+0/s</div><div class="stat-lbl">PASSIVE</div></div>
      <div class="stat-card"><div class="stat-val" id="totalTapsDisplay">0</div><div class="stat-lbl">TOTAL TAPS</div></div>
    </div>

    <div class="level-section">
      <div class="level-info"><span id="levelLabel">LEVEL 1</span><span id="levelProgress">0 / 1,000</span></div>
      <div class="progress-track"><div class="progress-fill" id="levelBar" style="width:0%"></div></div>
    </div>

    <div class="tap-area">
      <div class="tap-orb-wrapper">
        <div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
        <div class="tap-orb" id="tapOrb"><div class="orb-icon">💎</div></div>
      </div>
    </div>

    <div class="energy-section">
      <div class="energy-header">
        <div class="energy-label">ENERGY</div>
        <div class="energy-count" id="energyCount">500 / 500</div>
      </div>
      <div class="energy-track"><div class="energy-fill" id="energyBar" style="width:100%"></div></div>
      <center><button class="boost-btn" id="boostBtn" onclick="useBoost()">⚡ FULL ENERGY BOOST</button></center>
    </div>
  </div>

  <!-- UPGRADES SCREEN -->
  <div class="screen" id="screen-upgrades">
    <div class="screen-title">⚡ UPGRADES</div>
    <div class="upgrades-grid" id="upgradesGrid"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="showScreen('tap', this)">
      <div class="nav-icon">🪙</div><div class="nav-lbl">TAP</div>
    </div>
    <div class="nav-item" onclick="showScreen('upgrades', this)">
      <div class="nav-icon">⚡</div><div class="nav-lbl">UPGRADES</div>
    </div>
  </div>

</div>

<script>
// TELEGRAM ENTEGRASYONU
const tg = window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const telegramUser = tg?.initDataUnsafe?.user;
let playerId = telegramUser ? telegramUser.id : 999999; 
let username = telegramUser ? (telegramUser.username || telegramUser.first_name) : "GUEST_PLAYER";

// !!! CRITICAL: SUPABASE AYARLARINIZI BURAYA YAZIN !!!
const SUPABASE_URL = "https://tjaxporolsdkyyfampha.supabase.co";
const SUPABASE_KEY = "sb_publishable_W7evFdD6UTtJS0kOF7a6Kg_GZDWFeC_";
let supabase = null;

try {
  if (SUPABASE_URL !== "https://tjaxporolsdkyyfampha.supabase.co") {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch(e) { console.error("Supabase bağlantı hatası:", e); }

// OYUN DURUMU (STATE)
let state = {
  coins: 0, totalTaps: 0, energy: 500, maxEnergy: 500,
  tapPower: 1, passiveIncome: 0, level: 1, xp: 0
};

const LEVELS = [
  { level: 1, name: 'BRONZE', xpNeeded: 1000 },
  { level: 2, name: 'SILVER', xpNeeded: 5000 },
  { level: 3, name: 'GOLD', xpNeeded: 25000 }
];

const UPGRADES = [
  { id: 'u1', name: 'Multi-Tap', icon: '👆', baseCost: 100, scale: 2, type: 'tap' },
  { id: 'u2', name: 'Crypto Miner', icon: '⛏️', baseCost: 250, scale: 2.2, type: 'passive' },
  { id: 'u3', name: 'Energy Tank', icon: '🔋', baseCost: 200, scale: 1.8, type: 'energy' }
];

let upgradeLevels = { u1: 0, u2: 0, u3: 0 };

// VERİTABANINDAN YÜKLE VEYA YEREL BAŞLAT
async function loadUserData() {
  document.getElementById('userName').textContent = username.toUpperCase();
  
  let loadedData = null;

  if (supabase) {
    try {
      const { data, error } = await supabase.from('players').select('*').eq('telegram_id', playerId).maybeSingle();
      if (data) loadedData = data;
    } catch(e) { console.log("Buluttan çekilemedi, yerel hafızaya geçiliyor."); }
  }

  if (!loadedData) {
    const local = localStorage.getItem('crypto_empire_save');
    if (local) loadedData = JSON.parse(local);
  }

  if (loadedData) {
    state.coins = loadedData.coins || 0;
    state.totalTaps = loadedData.total_taps || 0;
    state.level = loadedData.level || 1;
    state.passiveIncome = loadedData.passive_income || 0;
    
    // Yükseltme seviyelerini hesapla
    upgradeLevels.u1 = Math.max(0, state.tapPower - 1);
    upgradeLevels.u2 = Math.max(0, state.passiveIncome);
    upgradeLevels.u3 = Math.max(0, (state.maxEnergy - 500) / 100);
    
    state.maxEnergy = 500 + (upgradeLevels.u3 * 100);
    state.tapPower = 1 + upgradeLevels.u1;
  }
  
  state.energy = state.maxEnergy;
  updateUI();
  renderUpgrades();
}

async function saveUserData() {
  localStorage.setItem('crypto_empire_save', JSON.stringify(state));
  if (supabase) {
    try {
      await supabase.from('players').upsert({
        telegram_id: playerId,
        username: username,
        coins: state.coins,
        total_taps: state.totalTaps,
        level: state.level,
        passive_income: state.passiveIncome
      }, { onConflict: 'telegram_id' });
    } catch(e) {}
  }
}

function updateUI() {
  document.getElementById('coinDisplay').textContent = Math.floor(state.coins).toLocaleString();
  document.getElementById('tapPowerDisplay').textContent = '+' + state.tapPower;
  document.getElementById('passiveDisplay').textContent = '+' + state.passiveIncome + '/s';
  document.getElementById('totalTapsDisplay').textContent = state.totalTaps;
  document.getElementById('energyCount').textContent = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
  document.getElementById('energyBar').style.width = (state.energy / state.maxEnergy * 100) + '%';
  
  let curLvl = LEVELS[state.level - 1] || LEVELS[0];
  document.getElementById('levelLabel').textContent = `LEVEL ${state.level}`;
  document.getElementById('levelProgress').textContent = `${Math.floor(state.xp)} / ${curLvl.xpNeeded}`;
  document.getElementById('levelBar').style.width = Math.min(100, (state.xp / curLvl.xpNeeded * 100)) + '%';
  document.getElementById('userLevelLabel').textContent = `LEVEL ${state.level} · ${curLvl.name}`;
  document.getElementById('leagueBadge').textContent = curLvl.name;
}

function getCost(u) {
  let lvl = upgradeLevels[u.id];
  return Math.floor(u.baseCost * Math.pow(u.scale, lvl));
}

function renderUpgrades() {
  const grid = document.getElementById('upgradesGrid');
  grid.innerHTML = '';
  UPGRADES.forEach(u => {
    let cost = getCost(u);
    let card = document.createElement('div');
    card.className = 'upgrade-card' + (state.coins >= cost ? ' affordable' : '');
    card.innerHTML = `
      <div class="upgrade-icon">${u.icon}</div>
      <div class="upgrade-name">${u.name}</div>
      <div class="upgrade-level">Lvl ${upgradeLevels[u.id]}</div>
      <div class="upgrade-cost">🪙 ${cost.toLocaleString()}</div>
    `;
    card.onclick = () => buyUpgrade(u);
    grid.appendChild(card);
  });
}

function buyUpgrade(u) {
  let cost = getCost(u);
  if (state.coins >= cost) {
    state.coins -= cost;
    upgradeLevels[u.id]++;
    if (u.type === 'tap') state.tapPower += 1;
    if (u.type === 'passive') state.passiveIncome += 1;
    if (u.type === 'energy') { state.maxEnergy += 100; state.energy += 100; }
    saveUserData(); updateUI(); renderUpgrades();
    showToast("Yükseltme Alındı! ⚡");
  } else {
    showToast("Yetersiz Coin! 🪙");
  }
}

// DOKUNMA İŞLEMİ
document.getElementById('tapOrb').addEventListener('click', (e) => {
  if (state.energy >= 1) {
    state.energy -= 1;
    state.coins += state.tapPower;
    state.totalTaps += 1;
    state.xp += state.tapPower;
    
    // Floating text efekti
    let float = document.createElement('div');
    float.className = 'float-label'; float.textContent = `+${state.tapPower}`;
    float.style.left = e.clientX + 'px'; float.style.top = e.clientY + 'px';
    document.body.appendChild(float);
    setTimeout(() => float.remove(), 1000);

    // Seviye Atlama Kontrolü
    let curLvl = LEVELS[state.level - 1];
    if (curLvl && state.xp >= curLvl.xpNeeded && state.level < LEVELS.length) {
      state.level++; state.xp = 0;
      showToast("🎉 SEVİYE ATLADINIZ!");
    }

    updateUI();
  } else {
    showToast("⚡ Enerji kalmadı!");
  }
});

function useBoost() {
  state.energy = state.maxEnergy;
  updateUI();
  showToast("⚡ Enerji Fullendi!");
}

function showScreen(name, navEl) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  navEl.classList.add('active');
}

function showToast(msg) {
  let t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}

// DÖNGÜLER
setInterval(() => {
  if (state.passiveIncome > 0) {
    state.coins += (state.passiveIncome / 10);
    state.xp += (state.passiveIncome / 10);
    updateUI();
  }
  if (state.energy < state.maxEnergy) {
    state.energy = Math.min(state.maxEnergy, state.energy + 0.1);
    updateUI();
  }
}, 100);

// Her 5 saniyede bir kaydet
setInterval(saveUserData, 5000);

window.onload = loadUserData;
</script>
</body>
</html>
